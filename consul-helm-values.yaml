global:
  name: consul
  datacenter: dc1

  tls:
    enabled: true

  peering:
    enabled: true

  acls:
    manageSystemACLs: true
    auth-method:
      type: kubernetes
    argocd:
     enabled: true

server:
  replicas: 3
  storageClass: gp2

connectInject:
  enabled: true
  k8sAuthMethodHost: "https://kubernetes.default.svc"

meshGateway:
  enabled: true

controller:
  enabled: true